# Baut die Astro-Website in website/ und veröffentlicht sie auf GitHub Pages.
# Basiert auf der offiziellen Vorlage actions/starter-workflows/pages/astro.yml.
# Voraussetzung: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy Astro site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; laufende Deployments nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUILD_PATH: website

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Astro 7.4 verlangt Node >= 22.23.4 (siehe website/package.json); lokal wird Node 24 verwendet.
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_PATH }}

      # site und base kommen von GitHub Pages (z. B. https://joshuakistler.github.io und /KLWEB),
      # damit lokal weiterhin ohne Unterordner unter localhost:4321/ gearbeitet werden kann.
      - name: Build with Astro
        run: |
          npx --no-install astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
        working-directory: ${{ env.BUILD_PATH }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
